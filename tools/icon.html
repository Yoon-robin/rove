<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../ui/fonts/pretendard.css"><style>html,body{margin:0;background:transparent}</style>
<div class="m"><span>R</span></div>
<script>
const s = Number(new URLSearchParams(location.search).get("s")) || 256;
const st = document.createElement("style");
st.textContent = `.m{display:grid;place-items:center;width:${s}px;height:${s}px;border-radius:${Math.round(s * 0.22)}px;
background:radial-gradient(circle at 50% 42%, #10203f 0%, #060a14 62%);box-shadow:inset 0 0 0 ${Math.max(1, Math.round(s / 64))}px rgb(75 125 254 / 28%);
color:#fff;font:900 ${Math.round(s * 0.6)}px/1 'Pretendard Variable',Pretendard,'Segoe UI',sans-serif;letter-spacing:-0.02em;
text-shadow:0 0 ${(s * 0.11).toFixed(1)}px rgb(75 125 254 / 95%),0 0 ${(s * 0.03).toFixed(1)}px rgb(120 160 255 / 80%)}
.m span{transform:translateY(-${(s * 0.02).toFixed(1)}px)}`;
document.head.append(st);
</script>
