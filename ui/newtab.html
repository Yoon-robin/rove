<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'">
<meta name="color-scheme" content="dark">
<title>새 탭</title>
<link rel="stylesheet" href="fonts/pretendard.css">
<link rel="stylesheet" href="robin-ui.css">
<link rel="stylesheet" href="newtab.css">
</head>
<body class="rk newtab">
  <main>
    <form id="find" role="search">
      <svg class="rk-ico ic" aria-hidden="true"><use href="icons.svg#rk-i-search"/></svg>
      <input id="q" class="rk-input" type="search" name="q" autocomplete="off" spellcheck="false" placeholder="검색어 또는 주소" aria-label="검색어 또는 주소">
    </form>
    <section id="private" class="private" aria-labelledby="private-name" hidden>
      <h2 id="private-name"><svg class="rk-ico" aria-hidden="true"><use href="icons.svg#rk-i-private"/></svg>비공개 창</h2>
      <p>이 창에서 간 곳은 방문 기록에 남지 않아요. 비공개 창을 모두 닫으면 쿠키와 사이트 데이터도 지워져요.</p>
      <p>내려받은 파일과 즐겨찾기는 남아요. 가는 사이트, 인터넷 회사, 회사·학교 네트워크에서는 여전히 보일 수 있어요.</p>
    </section>
    <nav id="sites" aria-label="자주 가는 사이트" hidden></nav>
  </main>
  <nav id="links" class="links" aria-label="바로 가기" hidden></nav>
  <script src="newtab.js"></script>
</body>
</html>
